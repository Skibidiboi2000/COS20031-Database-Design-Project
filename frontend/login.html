<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — Fleet Management</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body class="login-body">

<div class="header">
  <h1>Fleet Management</h1>
  <a href="index.html" class="back">&larr; Back</a>
</div>

<div class="wrap login-wrap">

<input type="radio" name="role" id="role1" class="tab-input" checked>
<input type="radio" name="role" id="role2" class="tab-input">
<input type="radio" name="role" id="role3" class="tab-input">

<div class="role-tabs">
  <label for="role1"><span class="role-badge customer">Customer</span></label>
  <label for="role2"><span class="role-badge driver">Driver</span></label>
  <label for="role3"><span class="role-badge admin">Admin</span></label>
</div>

<div id="login1" class="login-box">
  <span class="icon">&#9737;</span>
  <h2>Customer Login</h2>
  <div class="form-group"><label>Email</label><input type="text" placeholder="customer@email.com" ></div>
  <div class="form-group"><label>Password</label><input type="password" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;" ></div>
  <button class="form-btn" >Sign In</button>
  <div class="hint">
    Track shipments<br>
    View delivery history<br>
    Contact support
  </div>
</div>

<div id="login2" class="login-box">
  <span class="icon">&#9782;</span>
  <h2>Driver Login</h2>
  <div class="form-group"><label>Driver ID</label><input type="text" placeholder="D-0001" ></div>
  <div class="form-group"><label>Password</label><input type="password" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;" ></div>
  <button class="form-btn" >Sign In</button>
  <div class="hint">
    View assigned vehicle<br>
    Report incidents<br>
    Check delivery schedule
  </div>
</div>

<div id="login3" class="login-box">
  <span class="icon">&#9881;</span>
  <h2>Admin Login</h2>
  <div class="form-group"><label>Username</label><input type="text" placeholder="admin" ></div>
  <div class="form-group"><label>Password</label><input type="password" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;" ></div>
  <button class="form-btn" >Sign In</button>
  <div class="hint">
    Manage fleet operations<br>
    View analytics &amp; reports<br>
    Manage users &amp; permissions
  </div>
</div>

</div>
</body>
</html>
